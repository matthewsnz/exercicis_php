<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBazar - Registre</title>
    <link rel="stylesheet" href="estils.css">
</head>
<body>
    <header>
        <p class="marca">BitBazar</p>
        <h1>Crear un compte</h1>
        <p>Registra't per comprar material informatic.</p>
    </header>

    <main>
        <form action="processa.php" method="post">
            <fieldset>
                <legend>Dades personals</legend>

                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required>

                <label for="cognoms">Cognoms</label>
                <input type="text" id="cognoms" name="cognoms" required>

                <label for="naixement">Data de naixement</label>
                <input type="date" id="naixement" name="naixement">

                <label for="telefon">Telefon</label>
                <input type="tel" id="telefon" name="telefon">
            </fieldset>

            <fieldset>
                <legend>Dades del compte</legend>

                <label for="correu">Correu electronic</label>
                <input type="email" id="correu" name="correu" required>

                <label for="usuari">Nom d'usuari</label>
                <input type="text" id="usuari" name="usuari" required>

                <label for="clau">Contrasenya</label>
                <input type="password" id="clau" name="clau" required>

                <label for="clau2">Repeteix la contrasenya</label>
                <input type="password" id="clau2" name="clau2" required>
            </fieldset>

            <fieldset>
                <legend>Adreca</legend>

                <label for="carrer">Carrer i numero</label>
                <input type="text" id="carrer" name="carrer">

                <label for="poblacio">Poblacio</label>
                <input type="text" id="poblacio" name="poblacio">

                <label for="cp">Codi postal</label>
                <input type="text" id="cp" name="cp" maxlength="5">
            </fieldset>

            <fieldset>
                <legend>Preferencies</legend>

                <label for="tipus">Tipus de client</label>
                <select id="tipus" name="tipus" required>
                    <option value="">Tria una opcio</option>
                    <option value="Particular">Particular</option>
                    <option value="Professional">Professional</option>
                    <option value="Empresa">Empresa</option>
                </select>

                <p class="pregunta">Com ens has conegut?</p>
                <label class="linia"><input type="radio" name="origen" value="Xarxes socials"> Xarxes socials</label>
                <label class="linia"><input type="radio" name="origen" value="Amics"> Un amic o amiga</label>
                <label class="linia"><input type="radio" name="origen" value="Internet"> Cercant per internet</label>

                <label class="linia"><input type="checkbox" name="butlleti" value="si"> Vull rebre ofertes i novetats</label>
                <label class="linia"><input type="checkbox" name="condicions" value="si" required> Accepto les condicions del servei</label>
            </fieldset>

            <button type="submit">Crear el compte</button>
        </form>
    </main>

    <footer>
        <p>BitBazar · Botiga de material informatic</p>
    </footer>
</body>
</html>
