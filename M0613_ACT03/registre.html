      <label for="">Cognom</label>

      <label for="">Data de naixement</label>

      </div>

      <div id="dadesCompte">
        <h3>Dades del compte</h3>
        <label for="">Correu: </label>

        <label for="">Nom d'usuari: </label>
        <input type="text" name="user" id="user">

        <label for="">Contrasenya: </label>
        <input type="password" name="psw" id="psw">

        <label for="">Repetir Contrasenya: </label>
        <input type="password" name="psw" id="psw">
      </div>

      <div id="direccio">

      </div>


    </form>
  </div>
